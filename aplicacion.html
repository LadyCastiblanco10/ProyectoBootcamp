<h1>Lista de Personas para Analisis</h1>
 <table class="table table-success table-striped">
        <thead>        
       <th>Edad</th>
        <th>Identificación</th>
       <th>Nombre</th>

        </thead>

        <tbody id="cuerpoTabla">

        

        </tbody>
    </table>
<script>
    async function obtenerdatos(){
     respuesta = await fetch("http://127.0.0.1:5000/listaEstudiantes");
     console.log(respuesta)
      datos = await respuesta.json();
    console.log(datos);
    cuerpoTabla = document.getElementById("cuerpoTabla");
    
    cuerpoTabla.innerHTML = " ";
    datos.forEach(Estudiante => {
        Fila = document.createElement("tr");
        Fila.innerHTML = `<td>${Estudiante.edad}  </td>  <td> ${Estudiante.identificacion} </td> <td> 
            ${Estudiante.nombre}  </td> `; 
        cuerpoTabla.appendChild(Fila);

        
    });

    }

    document.addEventListener("DOMContentLoaded", obtenerdatos);
   
</script>
